<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>NOTUA – keine Verbindung</title>
<style>
  :root{--canvas:#e0e0e0; --dot:#c1c1c2; --surface:#ededed; --ink:#242428; --muted:#64646e; --border:#cececf; --accent:#2B2D33; --accent-ink:#FFFFFF;}
  @media (prefers-color-scheme: dark){:root{--canvas:#13161a; --dot:#232932; --surface:#1d2229; --ink:#e5e9f0; --muted:#95a4bb; --border:#2a313b; --accent:#9AA8DA; --accent-ink:#13161A;}}
  html,body{height:100%; margin:0;}
  body{background:var(--canvas); background-image:radial-gradient(var(--dot) 1.2px, transparent 1.4px); background-size:22px 22px;
    color:var(--ink); font-family:'IBM Plex Sans','Segoe UI',-apple-system,system-ui,sans-serif; display:grid; place-items:center; padding:24px; box-sizing:border-box;}
  .box{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 30px; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,0.15);}
  .mark{display:flex; align-items:center; gap:10px; font-weight:700; font-size:22px; letter-spacing:-0.02em;}
  .mark span{width:12px; height:12px; border-radius:50%; background:var(--accent);}
  h1{font-size:17px; margin:18px 0 6px;}
  p{margin:0; color:var(--muted); font-size:14px; line-height:1.55;}
  .btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:20px;}
  .detail{margin-top:10px; font:12px ui-monospace,'SF Mono',Consolas,monospace; color:var(--muted); opacity:.8; word-break:break-word;}
  button.sec{background:transparent; color:var(--ink); border:1px solid var(--border);}
  button.link{margin-top:14px; background:none; border:0; padding:0; color:var(--muted); font-weight:500; text-decoration:underline; text-underline-offset:3px;}
  button{ border:0; border-radius:10px; padding:10px 16px; font:600 14px inherit; font-family:inherit; background:var(--accent); color:var(--accent-ink); cursor:pointer;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
</style>
</head>
<body>
  <div class="box">
    <div class="mark"><span></span>NOTUA</div>
    <h1 id="h">Keine Verbindung zu notua.site</h1>
    <p id="p">Beim allerersten Start braucht NOTUA einmal Internet. Danach öffnen sich deine Boards auch offline. Prüfe die Verbindung und versuche es nochmal.</p>
    <p class="detail" id="d" hidden></p>
    <div class="btns">
      <button id="retry">Erneut versuchen</button>
      <button id="browser" class="sec">Im Browser öffnen</button>
    </div>
    <button id="log" class="link">Protokoll anzeigen</button>
  </div>
  <script>
    var q=new URLSearchParams(location.search);
    if(q.get('reason')==='timeout'){
      document.getElementById('h').textContent='NOTUA lädt gerade nicht';
      document.getElementById('p').textContent='notua.site hat nicht rechtzeitig geantwortet. Meist hilft „Erneut versuchen“. Klappt es dauerhaft nicht, öffne NOTUA im Browser und schick Tom das Protokoll.';
    }
    if(q.get('detail')){ var d=document.getElementById('d'); d.hidden=false; d.textContent=q.get('detail')+(q.get('v')?' · App '+q.get('v'):''); }
    var D=window.notuaDesktop||{};
    document.getElementById('retry').addEventListener('click', function(){ if(D.retry) D.retry(); else location.reload(); });
    document.getElementById('browser').addEventListener('click', function(){ if(D.openInBrowser) D.openInBrowser(); });
    document.getElementById('log').addEventListener('click', function(){ if(D.showLog) D.showLog(); });
    window.addEventListener('online', function(){ if(D.retry) D.retry(); });
  </script>
</body>
</html>
