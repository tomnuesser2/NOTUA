<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>NOTUA – keine Verbindung</title>
<style>
  :root{--canvas:#e0e0e0; --dot:#c1c1c2; --surface:#ededed; --ink:#242428; --muted:#64646e; --border:#cececf; --accent:#2B2D33; --accent-ink:#FFFFFF;}
  @media (prefers-color-scheme: dark){:root{--canvas:#13161a; --dot:#232932; --surface:#1d2229; --ink:#e5e9f0; --muted:#95a4bb; --border:#2a313b; --accent:#9AA8DA; --accent-ink:#13161A;}}
  html,body{height:100%; margin:0;}
  body{background:var(--canvas); background-image:radial-gradient(var(--dot) 1.2px, transparent 1.4px); background-size:22px 22px;
    color:var(--ink); font-family:'IBM Plex Sans','Segoe UI',-apple-system,system-ui,sans-serif; display:grid; place-items:center; padding:24px; box-sizing:border-box;}
  .box{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 30px; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,0.15);}
  .mark{display:flex; align-items:center; gap:10px; font-weight:700; font-size:22px; letter-spacing:-0.02em;}
  .mark span{width:12px; height:12px; border-radius:50%; background:var(--accent);}
  h1{font-size:17px; margin:18px 0 6px;}
  p{margin:0; color:var(--muted); font-size:14px; line-height:1.55;}
  button{margin-top:20px; border:0; border-radius:10px; padding:10px 16px; font:600 14px inherit; font-family:inherit; background:var(--accent); color:var(--accent-ink); cursor:pointer;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
</style>
</head>
<body>
  <div class="box">
    <div class="mark"><span></span>NOTUA</div>
    <h1>Keine Verbindung zu notua.site</h1>
    <p>Beim allerersten Start braucht NOTUA einmal Internet. Danach öffnen sich deine Boards auch offline. Prüfe die Verbindung und versuche es nochmal.</p>
    <button id="retry">Erneut versuchen</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', function(){ if(window.notuaDesktop) window.notuaDesktop.retry(); else location.reload(); });
    window.addEventListener('online', function(){ if(window.notuaDesktop) window.notuaDesktop.retry(); });
  </script>
</body>
</html>
