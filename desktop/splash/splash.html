<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src data:">
<title>NOTUA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Schwebendes Startbild: Das Fenster selbst ist durchsichtig (760x480), sichtbar sind nur Karte und Elemente. */
  :root{
    --canvas:#E7EAEE; --surface:#FFFFFF; --surface-2:#F0F2F5;
    --ink:#1B2027; --muted:#5C6570; --faint:#8A9099; --border:#D7DBE1; --accent:#FF6B57;
    --shadow:rgba(24,28,35,0.16); --shadow-lg:rgba(24,28,35,0.28);
    --tag-yellow:235,186,66; --tag-blue:90,159,214; --tag-pink:227,132,171; --tag-alpha:0.22;
    --f-sans:'IBM Plex Sans','Segoe UI',-apple-system,system-ui,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  }
  :root.dark{
    --canvas:#14171C; --surface:#1E222A; --surface-2:#191C22;
    --ink:#ECEEF2; --muted:#9AA3AF; --faint:#6B7480; --border:#2C3038; --accent:#FF7A66;
    --shadow:rgba(0,0,0,0.45); --shadow-lg:rgba(0,0,0,0.6); --tag-alpha:0.26;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0; width:760px; height:480px; overflow:hidden; background:transparent; -webkit-user-select:none; user-select:none; cursor:default;}
  .splash{position:relative; width:760px; height:480px; font-family:var(--f-sans); color:var(--ink);}
  .card{position:absolute; left:30px; top:120px; width:540px; height:300px; border-radius:22px; background:var(--surface);
    box-shadow:0 0 0 1px var(--border), 0 26px 60px var(--shadow-lg), 0 3px 10px var(--shadow);
    padding:34px 36px 24px; display:flex; flex-direction:column;}
  .mark{display:flex; align-items:center; gap:14px;}
  .mark .dot{width:22px; height:22px; border-radius:6px; background:var(--accent); flex:none;}
  .mark h1{margin:0; font-size:64px; font-weight:700; letter-spacing:-0.035em; line-height:0.9;}
  .meta{margin-top:18px; font-size:13px; line-height:1.55; max-width:300px;}
  .meta .st{color:var(--muted);}
  .bar{margin-top:12px; width:290px; height:3px; border-radius:2px; background:var(--surface-2); overflow:hidden;}
  .bar span{display:block; height:100%; width:6%; background:var(--accent); border-radius:2px; transition:width .6s cubic-bezier(.3,.7,.3,1);}
  .by{margin-top:auto; display:flex; align-items:baseline; gap:8px; font-size:13px; color:var(--muted);}
  .by strong{font-size:19px; font-weight:600; color:var(--ink); letter-spacing:-0.01em;}
  .legal{margin-top:8px; font-size:9.5px; line-height:1.45; color:var(--faint); max-width:300px;}

  .el{position:absolute; border-radius:12px; background:var(--surface); box-shadow:0 0 0 1px var(--border), 0 2px 4px var(--shadow), 0 14px 32px var(--shadow-lg);}
  .note{left:350px; top:62px; width:172px; padding:14px 15px; display:flex; flex-direction:column; gap:8px; transform:rotate(-6deg); z-index:1;
    background:linear-gradient(rgba(var(--tag-yellow),var(--tag-alpha)),rgba(var(--tag-yellow),var(--tag-alpha))), var(--surface);}
  .ttl{font-size:13px; font-weight:600; white-space:nowrap;}
  .ln{height:6px; border-radius:3px; background:rgba(127,135,146,0.32);}
  .img{left:478px; top:22px; width:186px; padding:8px; transform:rotate(4deg); z-index:2;}
  .pic{height:196px; border-radius:7px; position:relative; overflow:hidden; background:linear-gradient(180deg,#8CB8E6 0%,#C7DDF2 55%,#F4D6B8 100%);}
  .pic::before{content:''; position:absolute; left:-30%; right:20%; bottom:-50px; height:120px; border-radius:50%; background:#6FAE73;}
  .pic::after{content:''; position:absolute; left:35%; right:-35%; bottom:-64px; height:130px; border-radius:50%; background:#4F8F5F;}
  .pic b{position:absolute; left:26px; top:22px; width:26px; height:26px; border-radius:50%; background:#FFD27A; box-shadow:0 0 0 8px rgba(255,210,122,0.25);}
  .cap{font:500 10.5px var(--f-mono); color:var(--muted); padding:7px 2px 1px;}
  .sel{position:absolute; inset:-5px; border:1.6px solid var(--accent); border-radius:15px;}
  .sel i{position:absolute; width:9px; height:9px; background:var(--surface); border:1.6px solid var(--accent); border-radius:2.5px;}
  .sel i:nth-child(1){left:-5px; top:-5px;} .sel i:nth-child(2){right:-5px; top:-5px;}
  .sel i:nth-child(3){left:-5px; bottom:-5px;} .sel i:nth-child(4){right:-5px; bottom:-5px;}
  .cal{left:432px; top:318px; width:150px; padding:12px 13px; transform:rotate(5deg); z-index:3;}
  .day{display:flex; align-items:baseline; gap:8px;}
  .day strong{font-size:30px; font-weight:700; letter-spacing:-0.03em; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums;}
  .day span{font:500 10.5px var(--f-mono); color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;}
  .ev{margin-top:9px; padding:6px 8px; border-radius:7px; font-size:11px; font-weight:500; background:rgba(var(--tag-pink),var(--tag-alpha)); display:flex; justify-content:space-between; gap:6px; white-space:nowrap;}
  .ev em{font-style:normal; color:var(--muted); font-family:var(--f-mono); font-size:10px;}
  .chkc{left:566px; top:236px; width:180px; padding:14px 15px; display:flex; flex-direction:column; gap:8px; transform:rotate(-2.5deg); z-index:4;
    background:linear-gradient(rgba(var(--tag-blue),var(--tag-alpha)),rgba(var(--tag-blue),var(--tag-alpha))), var(--surface);}
  .chk{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); white-space:nowrap;}
  .chk i{width:13px; height:13px; border-radius:3.5px; border:1.5px solid var(--faint); flex:none; position:relative; transition:background .2s, border-color .2s;}
  .chk i::after{content:''; position:absolute; left:3.4px; top:0.6px; width:3.6px; height:7px; border:solid #fff; border-width:0 1.7px 1.7px 0; transform:rotate(45deg) scale(0); transition:transform .22s cubic-bezier(.34,1.56,.64,1);}
  .chk.done i{background:var(--accent); border-color:var(--accent);}
  .chk.done i::after{transform:rotate(45deg) scale(1);}
  .chk.done span{text-decoration:line-through; text-decoration-color:var(--faint);}
  svg.wires{position:absolute; left:0; top:0; width:760px; height:480px; overflow:visible; z-index:0;}
  svg.wires path{fill:none; stroke:var(--faint); stroke-width:1.7; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1;}
  svg.wires circle{fill:var(--surface); stroke:var(--faint); stroke-width:1.7; opacity:0;}

  .play .card{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;}
  .play .mark .dot{animation:dotIn .5s cubic-bezier(.34,1.56,.64,1) .15s both, dotRound .5s cubic-bezier(.34,1.56,.64,1) 1s forwards;}
  .play .mark h1{animation:rise .55s cubic-bezier(.2,.8,.2,1) .2s both;}
  .play .meta,.play .bar{animation:rise .5s cubic-bezier(.2,.8,.2,1) .3s both;}
  .play .by,.play .legal{animation:rise .5s cubic-bezier(.2,.8,.2,1) .4s both;}
  .play .el{animation:fly .7s cubic-bezier(.18,.9,.25,1.12) both;}
  .play .note{--r:-6deg; --fx:-30px; --fy:-40px; animation-delay:.35s;}
  .play .img{--r:4deg; --fx:40px; --fy:-50px; animation-delay:.5s;}
  .play .cal{--r:5deg; --fx:-10px; --fy:60px; animation-delay:.65s;}
  .play .chkc{--r:-2.5deg; --fx:60px; --fy:30px; animation-delay:.8s;}
  .play .sel{animation:fade .25s ease 1.35s both;}
  .play svg.wires path{animation:wire .6s ease-in-out 1.2s forwards;}
  .play svg.wires circle{animation:fade .25s ease forwards;}
  .play svg.wires circle.a{animation-delay:1.2s;} .play svg.wires circle.b{animation-delay:1.75s;}
  .out{animation:out .38s ease forwards;}
  @keyframes cardIn{from{opacity:0; transform:scale(.965) translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes dotIn{from{transform:scale(0) rotate(-45deg);} to{transform:scale(1);}}
  @keyframes dotRound{to{border-radius:50%;}}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  @keyframes fly{0%{opacity:0; transform:translate(var(--fx),var(--fy)) rotate(calc(var(--r) * 3)) scale(.9);} 100%{opacity:1; transform:rotate(var(--r));}}
  @keyframes wire{to{stroke-dashoffset:0;}}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  @keyframes out{to{opacity:0; transform:scale(1.015);}}
  @media (prefers-reduced-motion: reduce){
    .play .el,.play .card,.play .mark .dot,.play .mark h1,.play .meta,.play .bar,.play .by,.play .legal{animation:fade .3s ease both !important;}
    .play .el{transform:rotate(var(--r));}
    .play svg.wires path{animation:none; stroke-dashoffset:0;}
  }
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="card">
    <div class="mark"><span class="dot"></span><h1>NOTUA</h1></div>
    <div class="meta"><span id="ver">Version</span><br><span class="st" id="st">Starte NOTUA …</span></div>
    <div class="bar"><span id="bar"></span></div>
    <div class="by">von <strong>Tom Nüßer</strong></div>
    <div class="legal">© 2026 Tom Nüßer · notua.site · Boards, Notizen und Kalender. Deine Boards sind auch offline verfügbar.</div>
  </div>
  <div class="el note"><div class="ttl">Ideen Herbst</div><div class="ln" style="width:92%"></div><div class="ln" style="width:68%"></div><div class="ln" style="width:80%"></div></div>
  <div class="el img"><div class="pic"><b></b></div><div class="cap">moodboard.jpg</div><div class="sel"><i></i><i></i><i></i><i></i></div></div>
  <div class="el cal"><div class="day"><strong id="dd">23</strong><span id="dm">Do · Okt</span></div><div class="ev">Shooting <em>14:00</em></div></div>
  <div class="el chkc"><div class="ttl">Diese Woche</div>
    <div class="chk" data-t="1650"><i></i><span>Shooting planen</span></div>
    <div class="chk" data-t="2000"><i></i><span>Flyer drucken</span></div>
    <div class="chk"><i></i><span>Board teilen</span></div></div>
  <svg class="wires" aria-hidden="true"><path pathLength="1" d=""/><circle class="a" r="3.5"/><circle class="b" r="3.5"/></svg>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search), root=document.documentElement;
  var theme={}; try{ theme=JSON.parse(q.get('t')||'{}')||{}; }catch(e){}
  if(theme.dark) root.classList.add('dark');
  var vars=theme.vars||{};
  Object.keys(vars).forEach(function(k){ if(/^--[a-z0-9-]+$/.test(k)) root.style.setProperty(k, String(vars[k])); });
  document.getElementById('ver').textContent='Version '+(q.get('v')||'1.0.0')+' · '+(q.get('os')==='darwin'?'macOS':'Windows');
  // Kalender-Kärtchen zeigt das heutige Datum.
  var now=new Date(), WD=['So','Mo','Di','Mi','Do','Fr','Sa'], MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  document.getElementById('dd').textContent=now.getDate();
  document.getElementById('dm').textContent=WD[now.getDay()]+' · '+MO[now.getMonth()];

  var splash=document.getElementById('splash');
  function wire(){
    var dr=splash.getBoundingClientRect();
    function pt(el,fx,fy){ var r=el.getBoundingClientRect(); return [r.left-dr.left+r.width*fx, r.top-dr.top+r.height*fy]; }
    var a=pt(splash.querySelector('.note'),0.3,0.98), b=pt(splash.querySelector('.cal'),0.4,0.03);
    var svg=splash.querySelector('svg.wires');
    svg.querySelector('path').setAttribute('d','M'+a[0]+' '+a[1]+' C '+a[0]+' '+(a[1]+60)+', '+b[0]+' '+(b[1]-60)+', '+b[0]+' '+b[1]);
    var c=svg.querySelectorAll('circle'); c[0].setAttribute('cx',a[0]); c[0].setAttribute('cy',a[1]); c[1].setAttribute('cx',b[0]); c[1].setAttribute('cy',b[1]);
  }
  wire();
  void splash.offsetWidth; splash.classList.add('play');
  splash.querySelectorAll('.chk[data-t]').forEach(function(c){ setTimeout(function(){ c.classList.add('done'); }, +c.dataset.t); });

  var st=document.getElementById('st'), bar=document.getElementById('bar'), pct=6;
  // Leichtes Vorlaufen, solange die App nichts meldet; echte Schritte kommen per setStatus aus main.js.
  var creep=setInterval(function(){ if(pct<70){ pct+= (70-pct)*0.06; bar.style.width=pct+'%'; } }, 120);
  window.setStatus=function(text, p){
    if(text) st.textContent=text;
    if(typeof p==='number' && p>pct){ pct=p; bar.style.width=p+'%'; }
    if(p>=100) clearInterval(creep);
  };
  window.fadeOut=function(){ clearInterval(creep); splash.classList.add('out'); };
})();
</script>
</body>
</html>
