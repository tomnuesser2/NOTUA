  <meta charset="UTF-8">

<title>NOTUA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --canvas:#E7EAEE;
    --canvas-dot:#C6CCD4;
    --surface:#FFFFFF;
    --surface-2:#F0F2F5;
    --ink:#1B2027;
    --muted:#5C6570;
    --faint:#8A9099;
    --border:#D7DBE1;
    --border-strong:#C3C9D0;
    --accent:#FF6B57;
    --accent-ink:#FFFFFF;
    --accent-soft:#FFE3DD;
    --danger:#D64545;
    --danger-soft:#FBDFDD;
    --shadow:rgba(24,28,35,0.14);
    --shadow-lg:rgba(24,28,35,0.22);
    --tag-yellow:235,186,66; --tag-pink:227,132,171; --tag-blue:90,159,214;
    --tag-green:107,171,110; --tag-purple:158,128,193; --tag-grey:140,149,160; --tag-orange:222,138,79;
    --tag-alpha:0.20; --tag-alpha-strong:0.85;
    --scrim:rgba(20,23,28,0.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#14171C; --canvas-dot:#262B33; --surface:#1E222A; --surface-2:#191C22;
      --ink:#ECEEF2; --muted:#9AA3AF; --faint:#6B7480; --border:#2C3038; --border-strong:#383D46;
      --accent:#FF7A66; --accent-ink:#1B0E0B; --accent-soft:rgba(255,122,102,0.18);
      --danger:#FF6B6B; --danger-soft:rgba(255,107,107,0.16);
      --shadow:rgba(0,0,0,0.45); --shadow-lg:rgba(0,0,0,0.6);
      --tag-alpha:0.26; --scrim:rgba(6,7,9,0.6);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#14171C; --canvas-dot:#262B33; --surface:#1E222A; --surface-2:#191C22;
    --ink:#ECEEF2; --muted:#9AA3AF; --faint:#6B7480; --border:#2C3038; --border-strong:#383D46;
    --accent:#FF7A66; --accent-ink:#1B0E0B; --accent-soft:rgba(255,122,102,0.18);
    --danger:#FF6B6B; --danger-soft:rgba(255,107,107,0.16);
    --shadow:rgba(0,0,0,0.45); --shadow-lg:rgba(0,0,0,0.6);
    --tag-alpha:0.26; --scrim:rgba(6,7,9,0.6);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font-family:inherit;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;}
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  [hidden]{display:none !important;}

  /* ---------- HOME VIEW ---------- */
  #homeView{position:absolute; inset:0; overflow-y:auto; background:var(--surface-2);}
  .home-header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:36px 44px 18px; max-width:1180px; margin:0 auto; gap:16px; flex-wrap:wrap;
  }
  .wordmark{display:flex; align-items:center; gap:10px;}
  .wordmark h1{font-size:1.7rem; font-weight:700; letter-spacing:-0.02em; margin:0; text-wrap:balance;}
  .wordmark .logo-dot{width:11px; height:11px; border-radius:4px; background:var(--accent); flex:none;}
  .tagline{color:var(--muted); font-size:0.92rem; margin:2px 0 0;}
  .board-count{color:var(--faint); font-size:0.8rem;}
  .home-header-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
  .folder-toolbar{display:flex; align-items:center; gap:8px;}
  .folder-btn{
    display:flex; align-items:center; gap:7px; padding:7px 13px; border-radius:20px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); font-size:0.78rem; cursor:pointer; font-family:inherit; max-width:220px;
  }
  .folder-btn span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .folder-btn:hover{border-color:var(--border-strong); color:var(--ink);}
  .folder-btn.connected{color:var(--accent); border-color:var(--accent-soft); background:var(--accent-soft);}
  .folder-btn.pending{color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft);}
  .icon-btn.import-btn{
    width:34px; height:34px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer;
  }
  .icon-btn.import-btn:hover{border-color:var(--border-strong); color:var(--ink);}
  .home-main{max-width:1180px; margin:0 auto; padding:8px 44px 80px;}
  .board-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
    gap:18px;
  }
  .board-tile{
    position:relative; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:18px 18px 16px; height:158px;
    display:flex; flex-direction:column; justify-content:space-between;
    cursor:pointer; transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    overflow:hidden;
  }
  .board-tile:hover{box-shadow:0 10px 24px -8px var(--shadow); transform:translateY(-1px); border-color:var(--border-strong);}
  .board-tile .spine{width:34px; height:6px; border-radius:3px; background:var(--accent);}
  .board-tile h3{
    font-size:1.05rem; font-weight:600; margin:12px 0 0; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    outline:none; text-wrap:balance;
  }
  .board-tile h3[contenteditable="true"]{-webkit-line-clamp:unset; overflow:visible; box-shadow:0 0 0 2px var(--accent); border-radius:4px; padding:0 2px;}
  .board-tile .meta{display:flex; justify-content:space-between; align-items:flex-end; color:var(--faint); font-size:0.72rem;}
  .tile-actions{
    position:absolute; top:10px; right:10px; display:flex; gap:5px;
    opacity:0; transition:opacity .15s ease;
  }
  .board-tile:hover .tile-actions{opacity:1;}
  .tile-actions button{
    width:26px; height:26px; border-radius:7px;
    border:none; background:var(--surface-2); color:var(--muted); display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, color .15s ease; cursor:pointer;
  }
  .tile-actions .del-btn:hover{background:var(--danger-soft); color:var(--danger);}
  .tile-actions .export-btn:hover{background:var(--accent-soft); color:var(--accent);}
  .board-tile.new-tile{
    align-items:center; justify-content:center; flex-direction:row; gap:8px;
    border:1.5px dashed var(--border-strong); background:transparent; color:var(--muted); font-weight:500;
  }
  .board-tile.new-tile:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .empty-home{
    text-align:center; padding:70px 20px; color:var(--muted); max-width:420px; margin:0 auto;
  }
  .empty-home svg{opacity:.5; margin-bottom:10px;}
  .empty-home p{font-size:0.92rem; line-height:1.5;}

  /* ---------- BOARD VIEW ---------- */
  #boardView{position:absolute; inset:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; gap:10px; padding:0 16px; height:52px; flex:none;
    background:var(--surface); border-bottom:1px solid var(--border); z-index:30;
  }
  .crumbs{display:flex; align-items:center; gap:6px; font-size:0.86rem; color:var(--muted); overflow:hidden; white-space:nowrap; flex:1;}
  .crumbs button{background:none; border:none; color:var(--muted); font:inherit; cursor:pointer; padding:4px 6px; border-radius:6px;}
  .crumbs button:hover{background:var(--surface-2); color:var(--ink);}
  .crumbs .sep{color:var(--faint);}
  .crumbs .current{
    color:var(--ink); font-weight:600; outline:none; padding:4px 6px; border-radius:6px; max-width:40vw; overflow:hidden; text-overflow:ellipsis;
  }
  .crumbs .current[contenteditable="true"]{box-shadow:0 0 0 2px var(--accent); background:var(--surface-2);}
  .icon-btn{
    width:32px; height:32px; border-radius:8px; border:none; background:transparent; color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--ink);}

  .canvas-viewport{position:relative; z-index:0; flex:1; overflow:hidden; background:var(--canvas); cursor:default; isolation:isolate;}
  .canvas-viewport.panning, .canvas-viewport.space-down{cursor:grab;}
  .canvas-viewport.panning-active{cursor:grabbing;}
  .canvas-viewport.connect-mode{cursor:crosshair;}
  .canvas-inner{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform;}
  .grid-layer{position:absolute; inset:-4000px; background-image:radial-gradient(var(--canvas-dot) 1.4px, transparent 1.4px); pointer-events:none;}
  .grid-layer.hidden-grid{display:none;}
  #connectorSvg{position:absolute; overflow:visible; left:0; top:0; pointer-events:none;}
  #connectorSvg line{stroke:var(--faint); stroke-width:2; marker-end:url(#arrowhead);}
  #connectorSvg line.selected{stroke:var(--accent);}
  #connectorSvg line.hitline{stroke:transparent; stroke-width:16; pointer-events:stroke; cursor:pointer;}

  .empty-board-hint{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center;
    color:var(--faint); pointer-events:none; max-width:320px; font-size:0.88rem; line-height:1.5;
  }
  .empty-board-hint svg{opacity:.55; margin-bottom:8px;}

  /* selection rectangle */
  .marquee{position:absolute; border:1.5px solid var(--accent); background:rgba(255,107,87,0.10); pointer-events:none; z-index:5;}

  /* ---------- CARDS ---------- */
  .card{
    position:absolute; border-radius:10px; background:var(--surface); border:1px solid var(--border);
    box-shadow:0 1px 2px var(--shadow); user-select:none; display:flex; flex-direction:column;
  }
  .card.dragging{box-shadow:0 14px 30px -10px var(--shadow-lg); cursor:grabbing;}
  .card.selected{box-shadow:0 0 0 2px var(--accent), 0 10px 22px -10px var(--shadow-lg);}
  .card-head{display:flex; align-items:center; gap:6px; padding:8px 10px 2px; cursor:grab; flex:none;}
  .card-head:active{cursor:grabbing;}
  .type-chip{
    width:16px; height:16px; border-radius:4px; display:flex; align-items:center; justify-content:center; flex:none; color:var(--muted);
  }
  .card-title-field{
    flex:1; font-size:0.78rem; font-weight:600; color:var(--muted); background:none; border:none; outline:none;
    font-family:inherit; padding:2px 2px; min-width:0; text-overflow:ellipsis;
  }
  .resize-handle{
    position:absolute; right:2px; bottom:2px; width:16px; height:16px; cursor:nwse-resize; z-index:2;
    background:linear-gradient(135deg, transparent 50%, var(--border-strong) 50%); border-radius:0 0 8px 0; opacity:0; transition:opacity .12s;
  }
  .card:hover .resize-handle, .card.selected .resize-handle{opacity:1;}

  /* note */
  .card-note{padding-bottom:6px;}
  .note-body{
    flex:1; padding:2px 12px 12px; font-size:0.92rem; line-height:1.5; outline:none; white-space:pre-wrap; word-break:break-word; cursor:text; min-height:20px;
  }
  .note-body:empty::before{content:attr(data-placeholder); color:var(--faint);}

  /* column */
  .card-column{background:rgba(var(--tint,140,149,160), var(--tag-alpha)); border-style:dashed; border-width:1.5px;}
  .card-column .card-head{cursor:grab;}
  .column-title{
    font-size:0.98rem; font-weight:700; background:none; border:none; outline:none; font-family:inherit; width:100%; padding:4px 12px 0; color:var(--ink);
  }
  .column-title::placeholder{color:var(--faint); font-weight:600;}

  /* checklist */
  .checklist-title{
    font-size:0.86rem; font-weight:700; background:none; border:none; outline:none; font-family:inherit; padding:4px 12px 0; color:var(--ink); width:100%;
  }
  .checklist-items{display:flex; flex-direction:column; padding:4px 6px 6px; gap:1px;}
  .check-row{display:flex; align-items:flex-start; gap:7px; padding:4px 6px; border-radius:6px;}
  .check-row:hover{background:var(--surface-2);}
  .check-row input[type="checkbox"]{margin-top:3px; accent-color:var(--accent); width:15px; height:15px; flex:none; cursor:pointer;}
  .check-row .txt{flex:1; font-size:0.86rem; outline:none; line-height:1.4; word-break:break-word; cursor:text;}
  .check-row.done .txt{color:var(--faint); text-decoration:line-through;}
  .check-row .rm{opacity:0; border:none; background:none; color:var(--faint); cursor:pointer; width:18px; height:18px; flex:none; border-radius:4px;}
  .check-row:hover .rm{opacity:1;}
  .check-row .rm:hover{color:var(--danger);}
  .add-item-row{display:flex; align-items:center; gap:6px; padding:4px 12px 10px;}
  .add-item-row input{
    flex:1; border:none; background:none; outline:none; font-family:inherit; font-size:0.84rem; color:var(--ink); padding:3px 0;
  }
  .add-item-row input::placeholder{color:var(--faint);}

  /* image */
  .card-image{padding:0; overflow:hidden;}
  .card-image .card-head{position:absolute; top:0; left:0; right:0; padding:6px 8px; background:linear-gradient(to bottom, rgba(0,0,0,.42), transparent); border-radius:10px 10px 0 0; opacity:0; transition:opacity .12s;}
  .card-image:hover .card-head, .card-image.selected .card-head{opacity:1;}
  .card-image .card-title-field{color:#fff;}
  .card-image .type-chip{color:#fff;}
  .card-image img{width:100%; height:100%; object-fit:cover; display:block; flex:1; pointer-events:none;}
  .card-image .caption{
    position:absolute; left:0; right:0; bottom:0; padding:6px 10px; font-size:0.74rem; color:#fff;
    background:linear-gradient(to top, rgba(0,0,0,.5), transparent); outline:none;
  }
  .card-image .caption:empty::before{content:attr(data-placeholder); color:rgba(255,255,255,.75);}
  .img-drop-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--faint); font-size:0.78rem; text-align:center; padding:10px; flex-direction:column; gap:6px;
  }

  /* youtube */
  .card-youtube{padding-bottom:0;}
  .yt-frame-wrap{flex:1; position:relative; background:#000; border-radius:0 0 10px 10px; overflow:hidden; min-height:60px;}
  .yt-frame-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:none;}
  .yt-input-wrap{flex:1; display:flex; align-items:center; padding:0 12px 12px; gap:8px;}
  .yt-input-wrap input{
    flex:1; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:0.82rem; outline:none; background:var(--surface); color:var(--ink);
  }
  .yt-input-wrap input:focus{border-color:var(--accent);}
  .yt-go{
    border:none; background:var(--accent); color:var(--accent-ink); border-radius:8px; padding:8px 12px; font-size:0.8rem; font-weight:600; cursor:pointer; flex:none;
  }

  /* board-link (nested board) */
  .card-boardlink{background:var(--surface); cursor:pointer;}
  .card-boardlink .bl-body{flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:10px 12px 12px; gap:6px;}
  .bl-spine{width:26px; height:5px; border-radius:3px; background:var(--accent);}
  .bl-name{font-size:0.9rem; font-weight:700; outline:none; word-break:break-word;}
  .bl-open{font-size:0.7rem; color:var(--muted); display:flex; align-items:center; gap:3px;}

  /* ---------- TAG COLOR CLASSES ---------- */
  .tag-none{--tint:255,255,255; }
  :root[data-theme="dark"] .tag-none, .card.tag-none{ }
  .tag-yellow{--tint:var(--tag-yellow); border-left:4px solid rgb(var(--tag-yellow)); background:rgba(var(--tag-yellow),var(--tag-alpha));}
  .tag-pink{--tint:var(--tag-pink); border-left:4px solid rgb(var(--tag-pink)); background:rgba(var(--tag-pink),var(--tag-alpha));}
  .tag-blue{--tint:var(--tag-blue); border-left:4px solid rgb(var(--tag-blue)); background:rgba(var(--tag-blue),var(--tag-alpha));}
  .tag-green{--tint:var(--tag-green); border-left:4px solid rgb(var(--tag-green)); background:rgba(var(--tag-green),var(--tag-alpha));}
  .tag-purple{--tint:var(--tag-purple); border-left:4px solid rgb(var(--tag-purple)); background:rgba(var(--tag-purple),var(--tag-alpha));}
  .tag-grey{--tint:var(--tag-grey); border-left:4px solid rgb(var(--tag-grey)); background:rgba(var(--tag-grey),var(--tag-alpha));}
  .tag-orange{--tint:var(--tag-orange); border-left:4px solid rgb(var(--tag-orange)); background:rgba(var(--tag-orange),var(--tag-alpha));}
  .card-column.tag-none{background:rgba(140,149,160,var(--tag-alpha)); border-color:var(--border-strong);}
  .card-column.tag-yellow{border-color:rgb(var(--tag-yellow));}
  .card-column.tag-pink{border-color:rgb(var(--tag-pink));}
  .card-column.tag-blue{border-color:rgb(var(--tag-blue));}
  .card-column.tag-green{border-color:rgb(var(--tag-green));}
  .card-column.tag-purple{border-color:rgb(var(--tag-purple));}
  .card-column.tag-grey{border-color:rgb(var(--tag-grey));}
  .card-column.tag-orange{border-color:rgb(var(--tag-orange));}

  /* ---------- DOCK ---------- */
  .dock{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:2px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:6px; box-shadow:0 10px 30px -10px var(--shadow-lg); z-index:25;
  }
  .dock-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px; width:58px; padding:7px 4px 6px; border:none; background:none;
    border-radius:10px; color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .dock-btn span{font-size:0.62rem; font-weight:500; letter-spacing:.01em;}
  .dock-btn:hover{background:var(--surface-2); color:var(--ink);}
  .dock-btn.active{background:var(--accent); color:var(--accent-ink);}
  .dock-sep{width:1px; height:30px; background:var(--border); margin:0 4px; flex:none;}

  /* ---------- ZOOM / GRID CONTROLS ---------- */
  .viewctl{
    position:absolute; right:16px; bottom:18px; display:flex; align-items:center; gap:4px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:5px; box-shadow:0 8px 20px -8px var(--shadow); z-index:25;
  }
  .viewctl button{
    width:28px; height:28px; border:none; background:none; color:var(--muted); border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .viewctl button:hover{background:var(--surface-2); color:var(--ink);}
  .viewctl button.toggled{background:var(--accent-soft); color:var(--accent);}
  .viewctl .zoom-pct{width:44px; text-align:center; font-size:0.74rem; color:var(--muted); flex:none;}
  .viewctl .vsep{width:1px; height:20px; background:var(--border); margin:0 3px;}

  /* ---------- INSPECTOR ---------- */
  .inspector{
    position:absolute; top:64px; right:16px; width:238px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 14px 34px -12px var(--shadow-lg); z-index:28; padding:14px; display:flex; flex-direction:column; gap:12px;
    animation:pop .12s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
  .insp-row{display:flex; flex-direction:column; gap:6px;}
  .insp-label{font-size:0.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); font-weight:600;}
  .swatches{display:flex; flex-wrap:wrap; gap:7px;}
  .swatch{
    width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .swatch.active{border-color:var(--ink);}
  .insp-actions{display:flex; gap:6px;}
  .insp-actions button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:7px 6px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink); font-size:0.74rem; cursor:pointer; font-family:inherit;
  }
  .insp-actions button:hover{border-color:var(--border-strong);}
  .insp-actions button.danger:hover{background:var(--danger-soft); color:var(--danger); border-color:var(--danger-soft);}
  .insp-count{font-size:0.78rem; color:var(--muted);}

  /* ---------- TOAST ---------- */
  .toast{
    position:absolute; left:16px; bottom:18px; background:var(--ink); color:var(--canvas); padding:10px 8px 10px 14px; border-radius:10px;
    display:flex; align-items:center; gap:10px; font-size:0.82rem; box-shadow:0 10px 26px -8px var(--shadow-lg); z-index:40;
    animation:pop .15s ease;
  }
  :root[data-theme="dark"] .toast{color:var(--ink); background:var(--surface); border:1px solid var(--border);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .toast{color:var(--ink); background:var(--surface); border:1px solid var(--border);} }
  .toast button{background:none; border:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; padding:4px 6px;}

  /* ---------- MODAL ---------- */
  .modal-scrim{position:absolute; inset:0; background:var(--scrim); z-index:50; display:flex; align-items:center; justify-content:center;}
  .modal{

<script>
(function(){
"use strict";

/* ============================================================
   UTILITIES
   ============================================================ */
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function debounce(fn,ms){let t; return function(...a){clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms);};}
function fmtDate(ts){
  try{
    const d=new Date(ts);
    return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return '';}
}
function escapeHtml(s){
  const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML;
}
function extractYouTubeId(url){
  if(!url) return null;
  url=url.trim();
  let m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([a-zA-Z0-9_-]{6,15})/);
  if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{6,15}$/.test(url)) return url;
  return null;
}
const TAG_COLORS=['none','yellow','pink','blue','green','purple','grey','orange'];

/* ============================================================
   INDEXEDDB DATA LAYER (fallback / cache for handle persistence)
   ============================================================ */
const DB_NAME='notua-db', DB_VERSION=2;
let dbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=(e)=>{
    const db=e.target.result;
    if(!db.objectStoreNames.contains('boards')) db.createObjectStore('boards',{keyPath:'id'});
    if(!db.objectStoreNames.contains('cards')){
      const s=db.createObjectStore('cards',{keyPath:'id'});
      s.createIndex('boardId','boardId',{unique:false});
    }
    if(!db.objectStoreNames.contains('connectors')){
      const s=db.createObjectStore('connectors',{keyPath:'id'});
      s.createIndex('boardId','boardId',{unique:false});
    }
    if(!db.objectStoreNames.contains('images')) db.createObjectStore('images',{keyPath:'id'});
    if(!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
  };
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
});

function tx(stores,mode){return dbPromise.then(db=>db.transaction(stores,mode));}
function reqp(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);});}

async function saveHandleRef(handle){
  try{ const t=await tx('handles','readwrite'); t.objectStore('handles').put(handle,'root'); return new Promise(r=>t.oncomplete=r); }catch(e){}
}
async function loadHandleRef(){
  try{ const t=await tx('handles','readonly'); return await reqp(t.objectStore('handles').get('root')); }catch(e){ return null; }
}
async function clearHandleRef(){
  try{ const t=await tx('handles','readwrite'); t.objectStore('handles').delete('root'); return new Promise(r=>t.oncomplete=r); }catch(e){}
}

const IDB_DB={
  async allBoards(){const t=await tx('boards','readonly'); return reqp(t.objectStore('boards').getAll());},
  async getBoard(id){const t=await tx('boards','readonly'); return reqp(t.objectStore('boards').get(id));},
  async putBoard(b){const t=await tx('boards','readwrite'); t.objectStore('boards').put(b); return new Promise(r=>t.oncomplete=r);},
  async deleteBoard(id){const t=await tx('boards','readwrite'); t.objectStore('boards').delete(id); return new Promise(r=>t.oncomplete=r);},

  async cardsForBoard(boardId){const t=await tx('cards','readonly'); return reqp(t.objectStore('cards').index('boardId').getAll(boardId));},
  async putCard(c){const t=await tx('cards','readwrite'); t.objectStore('cards').put(c); return new Promise(r=>t.oncomplete=r);},
  async putCards(list){const t=await tx('cards','readwrite'); const s=t.objectStore('cards'); list.forEach(c=>s.put(c)); return new Promise(r=>t.oncomplete=r);},
  async deleteCard(id){const t=await tx('cards','readwrite'); t.objectStore('cards').delete(id); return new Promise(r=>t.oncomplete=r);},

  async connectorsForBoard(boardId){const t=await tx('connectors','readonly'); return reqp(t.objectStore('connectors').index('boardId').getAll(boardId));},
  async putConnector(c){const t=await tx('connectors','readwrite'); t.objectStore('connectors').put(c); return new Promise(r=>t.oncomplete=r);},
  async deleteConnector(id){const t=await tx('connectors','readwrite'); t.objectStore('connectors').delete(id); return new Promise(r=>t.oncomplete=r);},

  async putImage(id,blob){const t=await tx('images','readwrite'); t.objectStore('images').put({id,blob}); return new Promise(r=>t.oncomplete=r);},
  async getImage(id){const t=await tx('images','readonly'); return reqp(t.objectStore('images').get(id));},
  async deleteImage(id){const t=await tx('images','readwrite'); t.objectStore('images').delete(id); return new Promise(r=>t.oncomplete=r);},
};

/* ============================================================
   FILE SYSTEM DATA LAYER (portable per-board folders)
   ============================================================ */
const FS_SUPPORTED = typeof window.showDirectoryPicker === 'function';

const fsState={
  root:null, rootName:'', pendingHandle:null,
  dirs:new Map(),        // boardId -> FileSystemDirectoryHandle
  cache:new Map(),       // boardId -> {meta,cards,connectors}
  cardOwner:new Map(),   // cardId -> boardId
  connOwner:new Map(),   // connectorId -> boardId
  imageOwner:new Map(),  // imageId -> boardId
  imageExt:new Map(),    // imageId -> '.png' etc
  writers:new Map(),     // boardId -> debounced writer fn
};

function slugify(name){
  const diacritics=new RegExp('['+String.fromCharCode(0x0300)+'-'+String.fromCharCode(0x036f)+']','g');
  const base=(name||'Board').normalize('NFKD').replace(diacritics,'')
    .replace(/[^A-Za-z0-9 _-]/g,'').trim().replace(/\s+/g,'-');
  return (base||'Board').slice(0,40);
}
function folderNameFor(id,name){ return slugify(name)+'-'+id.slice(0,6); }
function extForBlob(blob){
  const map={'image/png':'.png','image/jpeg':'.jpg','image/gif':'.gif','image/webp':'.webp','image/svg+xml':'.svg','image/bmp':'.bmp'};
  return (blob && map[blob.type]) || '.png';
}
async function findImageExt(imagesDir,id){
  for await (const name of imagesDir.keys()){
    if(name.startsWith(id+'.')) return name.slice(id.length);
  }
  return null;
}
async function fsGetFileJSON(dirHandle,filename,fallback){
  try{
    const fh=await dirHandle.getFileHandle(filename);
    const file=await fh.getFile();
    const text=await file.text();
    return text ? JSON.parse(text) : fallback;
  }catch(e){ return fallback; }
}
async function fsWriteFileJSON(dirHandle,filename,data){
  const fh=await dirHandle.getFileHandle(filename,{create:true});
  const w=await fh.createWritable();
  await w.write(JSON.stringify(data));
  await w.close();
}
async function fsEnsureBoardLoaded(boardId){
  if(fsState.cache.has(boardId)) return fsState.cache.get(boardId);
  const dir=fsState.dirs.get(boardId);
  if(!dir) return null;
  const data=await fsGetFileJSON(dir,'board.json',{meta:null,cards:[],connectors:[]});
  data.cards=data.cards||[]; data.connectors=data.connectors||[];
  fsState.cache.set(boardId,data);
  data.cards.forEach(c=>{
    fsState.cardOwner.set(c.id,boardId);
    if(c.type==='image' && c.data && c.data.imageId) fsState.imageOwner.set(c.data.imageId,boardId);
  });
  data.connectors.forEach(cn=>fsState.connOwner.set(cn.id,boardId));
  return data;
}
function fsWriteBoardSoon(boardId){
  if(!fsState.writers.has(boardId)){
    fsState.writers.set(boardId, debounce(async ()=>{
      const dir=fsState.dirs.get(boardId), data=fsState.cache.get(boardId);
      if(!dir||!data) return;
      try{ await fsWriteFileJSON(dir,'board.json',data); }catch(e){}
    },300));
  }
  fsState.writers.get(boardId)();
}

const FS_DB={
  async allBoards(){
    if(!fsState.root) return [];
    const out=[];
    for await (const handle of fsState.root.values()){
      if(handle.kind!=='directory') continue;
      const data=await fsGetFileJSON(handle,'board.json',null);
      if(!data || !data.meta || !data.meta.id) continue;
      const id=data.meta.id;
      fsState.dirs.set(id,handle);
      if(!fsState.cache.has(id)){
        fsState.cache.set(id,{meta:data.meta, cards:data.cards||[], connectors:data.connectors||[]});
        (data.cards||[]).forEach(c=>{
          fsState.cardOwner.set(c.id,id);
          if(c.type==='image' && c.data && c.data.imageId) fsState.imageOwner.set(c.data.imageId,id);
        });
        (data.connectors||[]).forEach(cn=>fsState.connOwner.set(cn.id,id));
      }
      out.push({...fsState.cache.get(id).meta});
    }
    return out;
  },
  async getBoard(id){ const e=await fsEnsureBoardLoaded(id); return e ? {...e.meta} : null; },
  async putBoard(b){
    let dir=fsState.dirs.get(b.id);
    if(!dir){
      const folderName=folderNameFor(b.id,b.name);
      dir=await fsState.root.getDirectoryHandle(folderName,{create:true});
      fsState.dirs.set(b.id,dir);
      fsState.cache.set(b.id,{meta:{...b}, cards:[], connectors:[]});
    }else{
      const entry=await fsEnsureBoardLoaded(b.id);
      entry.meta={...entry.meta, ...b};
    }
    fsWriteBoardSoon(b.id);
  },
  async deleteBoard(id){
    const dir=fsState.dirs.get(id);
    if(dir){ try{ await fsState.root.removeEntry(dir.name,{recursive:true}); }catch(e){} }
    fsState.dirs.delete(id); fsState.cache.delete(id); fsState.writers.delete(id);
  },

  async cardsForBoard(boardId){ const e=await fsEnsureBoardLoaded(boardId); return e ? e.cards.slice() : []; },
  async putCard(c){
    const e=await fsEnsureBoardLoaded(c.boardId); if(!e) return;
    const i=e.cards.findIndex(x=>x.id===c.id);
    if(i>=0) e.cards[i]=c; else e.cards.push(c);
    fsState.cardOwner.set(c.id,c.boardId);
    if(c.type==='image' && c.data && c.data.imageId) fsState.imageOwner.set(c.data.imageId,c.boardId);
    fsWriteBoardSoon(c.boardId);
  },
  async putCards(list){
    const byBoard=new Map();
    list.forEach(c=>{ if(!byBoard.has(c.boardId)) byBoard.set(c.boardId,[]); byBoard.get(c.boardId).push(c); });
    for(const [bid,cs] of byBoard){
      const e=await fsEnsureBoardLoaded(bid); if(!e) continue;
      cs.forEach(c=>{
        const i=e.cards.findIndex(x=>x.id===c.id);
        if(i>=0) e.cards[i]=c; else e.cards.push(c);
        fsState.cardOwner.set(c.id,bid);
      });
      fsWriteBoardSoon(bid);
    }
  },
  async deleteCard(id){
    const bid=fsState.cardOwner.get(id); if(!bid) return;
    const e=fsState.cache.get(bid); if(!e) return;
    e.cards=e.cards.filter(c=>c.id!==id);
    fsState.cardOwner.delete(id);
    fsWriteBoardSoon(bid);
  },

  async connectorsForBoard(boardId){ const e=await fsEnsureBoardLoaded(boardId); return e ? e.connectors.slice() : []; },
  async putConnector(c){
    const e=await fsEnsureBoardLoaded(c.boardId); if(!e) return;
    const i=e.connectors.findIndex(x=>x.id===c.id);
    if(i>=0) e.connectors[i]=c; else e.connectors.push(c);
    fsState.connOwner.set(c.id,c.boardId);
    fsWriteBoardSoon(c.boardId);
  },
  async deleteConnector(id){
    const bid=fsState.connOwner.get(id); if(!bid) return;
    const e=fsState.cache.get(bid); if(!e) return;
    e.connectors=e.connectors.filter(c=>c.id!==id);
    fsState.connOwner.delete(id);
    fsWriteBoardSoon(bid);
  },

  async putImage(id,blob,boardIdOverride){
    const bid=boardIdOverride || fsState.imageOwner.get(id) || state.currentBoardId;
    const dir=fsState.dirs.get(bid); if(!dir) return;
    try{
      const imagesDir=await dir.getDirectoryHandle('images',{create:true});
      const ext=extForBlob(blob);
      const fh=await imagesDir.getFileHandle(id+ext,{create:true});
      const w=await fh.createWritable(); await w.write(blob); await w.close();
      fsState.imageOwner.set(id,bid); fsState.imageExt.set(id,ext);
    }catch(e){}
  },
  async getImage(id){
    const bid=fsState.imageOwner.get(id) || state.currentBoardId;
    const dir=fsState.dirs.get(bid); if(!dir) return null;
    try{
      const imagesDir=await dir.getDirectoryHandle('images');
      let ext=fsState.imageExt.get(id);
      if(!ext){ ext=await findImageExt(imagesDir,id); if(ext) fsState.imageExt.set(id,ext); }
      if(!ext) return null;
      const fh=await imagesDir.getFileHandle(id+ext);
      const file=await fh.getFile();
      return {id, blob:file};
    }catch(e){ return null; }
  },
  async deleteImage(id){
    const bid=fsState.imageOwner.get(id); if(!bid) return;
    const dir=fsState.dirs.get(bid); if(!dir) return;
    try{
      const imagesDir=await dir.getDirectoryHandle('images');
      let ext=fsState.imageExt.get(id) || await findImageExt(imagesDir,id);
      if(ext) await imagesDir.removeEntry(id+ext);
    }catch(e){}
    fsState.imageOwner.delete(id); fsState.imageExt.delete(id);
  },
};

async function renderCrumbs(board){

    seen.add(cur.parentBoardId);
    cur=state.boards.find(b=>b.id===cur.parentBoardId) || await DB.getBoard(cur.parentBoardId);

  const home=document.createElement('button');

function applyView(){
  canvasInner.style.transform=`translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.zoom})`;
  gridLayer.style.backgroundSize=`${GRID_SIZE*state.view.zoom}px ${GRID_SIZE*state.view.zoom}px`;
  gridLayer.style.backgroundPosition=`${state.view.x}px ${state.view.y}px`;
  document.getElementById('zoomPct').textContent=Math.round(state.view.zoom*100)+'%';
}
const persistView=debounce(async ()=>{
  const b=boardById(state.currentBoardId); if(!b) return;
  b.view={...state.view}; b.gridEnabled=state.gridEnabled; b.snapEnabled=state.snapEnabled;
  await DB.putBoard(b);
},350);

function screenToCanvas(sx,sy){
  const r=viewport.getBoundingClientRect();
  return {x:(sx-r.left-state.view.x)/state.view.zoom, y:(sy-r.top-state.view.y)/state.view.zoom};
}
function zoomAt(clientX,clientY,factor){
  const r=viewport.getBoundingClientRect();
  const cx=clientX-r.left, cy=clientY-r.top;
  const before={x:(cx-state.view.x)/state.view.zoom, y:(cy-state.view.y)/state.view.zoom};
  state.view.zoom=clamp(state.view.zoom*factor,0.2,2.5);
  state.view.x=cx-before.x*state.view.zoom;
  state.view.y=cy-before.y*state.view.zoom;
  applyView(); persistView();
}

viewport.addEventListener('wheel',(e)=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){
    zoomAt(e.clientX,e.clientY, e.deltaY<0 ? 1.08 : 0.92);
  }else{
    state.view.x-=e.deltaX; state.view.y-=e.deltaY;
    applyView(); persistView();
  }
},{passive:false});

document.getElementById('zoomIn').addEventListener('click',()=>{const r=viewport.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1.2);});
document.getElementById('zoomOut').addEventListener('click',()=>{const r=viewport.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,0.82);});
document.getElementById('fitBtn').addEventListener('click',fitToContent);
function fitToContent(){
  if(state.cards.length===0){ state.view={x:viewport.clientWidth/2-200,y:viewport.clientHeight/2-150,zoom:1}; applyView(); persistView(); return;}
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.cards.forEach(c=>{minX=Math.min(minX,c.x); minY=Math.min(minY,c.y); maxX=Math.max(maxX,c.x+c.w); maxY=Math.max(maxY,c.y+c.h);});
  const pad=80; const w=maxX-minX+pad*2, h=maxY-minY+pad*2;
  const zx=viewport.clientWidth/w, zy=viewport.clientHeight/h;
  const zoom=clamp(Math.min(zx,zy),0.2,1.4);
  state.view.zoom=zoom;
  state.view.x=-(minX-pad)*zoom + (viewport.clientWidth-w*zoom)/2;
  state.view.y=-(minY-pad)*zoom + (viewport.clientHeight-h*zoom)/2;
  applyView(); persistView();
}
document.getElementById('gridToggle').addEventListener('click',(e)=>{

/* ---- panning: space+drag or middle mouse, or empty-canvas left-drag = marquee ---- */
let spaceDown=false;
window.addEventListener('keydown',(e)=>{
  if(e.code==='Space' && !isEditingTarget(e.target)){ spaceDown=true; viewport.classList.add('space-down'); }
});
window.addEventListener('keyup',(e)=>{ if(e.code==='Space'){ spaceDown=false; viewport.classList.remove('space-down'); }});

function isEditingTarget(t){
  return t && (t.isContentEditable || t.tagName==='INPUT' || t.tagName==='TEXTAREA');
}

let panState=null;
let marqueeState=null;
const marqueeEl=document.getElementById('marquee');

viewport.addEventListener('pointerdown',(e)=>{
  if(e.target.closest('.card') || e.target.closest('.viewctl') || e.target.closest('.dock') || e.target.closest('.inspector')) return;
  if(e.button===1 || spaceDown || e.button===0 && e.altKey){
    panState={sx:e.clientX,sy:e.clientY,ox:state.view.x,oy:state.view.y};
    viewport.classList.add('panning-active');
    viewport.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  if(e.button===0){
    if(state.connectMode){ cancelConnect(); }
    const cp=screenToCanvas(e.clientX,e.clientY);
    marqueeState={sx:e.clientX, sy:e.clientY, additive:e.shiftKey};
    if(!e.shiftKey){ clearSelection(); }
    marqueeEl.hidden=false;
    viewport.setPointerCapture(e.pointerId);
  }
});
viewport.addEventListener('pointermove',(e)=>{
  state.lastPointer=screenToCanvas(e.clientX,e.clientY);
  if(panState){
    state.view.x=panState.ox+(e.clientX-panState.sx);
    state.view.y=panState.oy+(e.clientY-panState.sy);
    applyView();
    return;
  }
  if(marqueeState){
    const x1=Math.min(marqueeState.sx,e.clientX), x2=Math.max(marqueeState.sx,e.clientX);
    const y1=Math.min(marqueeState.sy,e.clientY), y2=Math.max(marqueeState.sy,e.clientY);
    const r=viewport.getBoundingClientRect();
    marqueeEl.style.left=(x1-r.left)+'px'; marqueeEl.style.top=(y1-r.top)+'px';
    marqueeEl.style.width=(x2-x1)+'px'; marqueeEl.style.height=(y2-y1)+'px';
    const c1=screenToCanvas(x1,y1), c2=screenToCanvas(x2,y2);
    state.selection.clear();
    state.cards.forEach(c=>{
      if(c.x<c2.x && c.x+c.w>c1.x && c.y<c2.y && c.y+c.h>c1.y) state.selection.add(c.id);
    });
    applySelectionClasses();
  }
});
window.addEventListener('pointerup',(e)=>{
  if(panState){ panState=null; viewport.classList.remove('panning-active'); persistView(); }
  if(marqueeState){ marqueeState=null; marqueeEl.hidden=true; updateInspector(); }
});

let zCounter=1;
function nextZ(){ zCounter=Math.max(zCounter, ...state.cards.map(c=>c.z||0))+1; return zCounter; }

async function duplicateCards(cards){
  const idMap={};
  const copies=cards.map(c=>{
    const nc={...c, id:uid(), x:c.x+24, y:c.y+24, z:nextZ(), data:JSON.parse(JSON.stringify(c.data))};

/* ============================================================
   DELETE + UNDO
   ============================================================ */
async function deleteCards(ids){
  const bundle={kind:'cards', boardId:state.currentBoardId, cards:[], connectors:[], nestedBundles:[]};
  for(const id of ids){
    const card=state.cards.find(c=>c.id===id);
    if(!card) continue;
    bundle.cards.push(card);
    if(card.type==='boardlink' && card.data.boardId){
      const nb=await collectBoardBundle(card.data.boardId);
      bundle.nestedBundles.push(nb);
      await deleteBundle(nb);
    }
    state.connectors.filter(cn=>cn.fromId===id||cn.toId===id).forEach(cn=>bundle.connectors.push(cn));
  }
  for(const cn of bundle.connectors){ await DB.deleteConnector(cn.id); }
  for(const c of bundle.cards){ await DB.deleteCard(c.id); }
  state.cards=state.cards.filter(c=>!ids.includes(c.id));
  state.connectors=state.connectors.filter(cn=>!bundle.connectors.includes(cn));
  state.selection.clear();
  renderAllCards(); renderConnectors(); closeInspector(); updateEmptyHint();
  state.lastDeleted=bundle;
  showToast(ids.length>1?'Elemente gelöscht':'Element gelöscht', restoreLastDeleted);
}

async function collectBoardBundle(boardId){
  const bundle={kind:'board', boards:[], cards:[], connectors:[], images:[]};
  const queue=[boardId];
  const seen=new Set();
  while(queue.length){
    const bid=queue.shift();
    if(seen.has(bid)) continue; seen.add(bid);
    const board=await DB.getBoard(bid); if(!board) continue;
    bundle.boards.push(board);
    const cards=await DB.cardsForBoard(bid);
    bundle.cards.push(...cards);
    const conns=await DB.connectorsForBoard(bid);
    bundle.connectors.push(...conns);
    for(const c of cards){
      if(c.type==='image' && c.data.imageId){
        const img=await DB.getImage(c.data.imageId);
        if(img) bundle.images.push({id:img.id, blob:img.blob, boardId:bid});
      }
      if(c.type==='boardlink' && c.data.boardId) queue.push(c.data.boardId);
    }
  }
  return bundle;
}
async function deleteBundle(bundle){
  for(const cn of bundle.connectors) await DB.deleteConnector(cn.id);
  for(const c of bundle.cards) await DB.deleteCard(c.id);
  for(const img of (bundle.images||[])) await DB.deleteImage(img.id);
  for(const b of bundle.boards) await DB.deleteBoard(b.id);
}
async function restoreBundle(bundle){
  if(!bundle) return;
  if(bundle.kind==='board'){
    for(const b of bundle.boards) await DB.putBoard(b);
    for(const c of bundle.cards) await DB.putCard(c);
    for(const cn of bundle.connectors) await DB.putConnector(cn);
    for(const img of (bundle.images||[])) await DB.putImage(img.id,img.blob,img.boardId);
  }else if(bundle.kind==='cards'){
    for(const c of bundle.cards) await DB.putCard(c);
    for(const cn of bundle.connectors) await DB.putConnector(cn);
    for(const nb of (bundle.nestedBundles||[])) await restoreBundle(nb);
  }
}
async function restoreLastDeleted(){
  const bundle=state.lastDeleted;
  if(!bundle) return;
  await restoreBundle(bundle);
  state.lastDeleted=null;
  if(state.screen==='home'){ refreshHome(); }
  else{
    state.cards=await DB.cardsForBoard(state.currentBoardId);
    state.connectors=await DB.connectorsForBoard(state.currentBoardId);
    renderAllCards(); renderConnectors(); updateEmptyHint();
  }
}

window.addEventListener('keydown',(e)=>{

let toastTimer=null;
function showToast(msg,onUndo){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<span>${escapeHtml(msg)}</span>`;
  if(onUndo){

/* ============================================================
   DRAG / RESIZE / SELECT interactions on a card
   ============================================================ */
function attachDragAndSelect(el,card){
  let dragState=null;
  const head = el.querySelector('.card-head') || el;
  // Image cards: the header strip is only 26px tall and invisible until hover (it overlays the
  // photo), so requiring users to find it to move a screenshot is not discoverable — the whole
  // card is the drag surface instead, like grabbing a physical photo. The caption field and the
  // resize handle already stop propagation on their own, so this doesn't fight with editing them.
  // Board-link tiles have no separate header content either, so the same applies there.
  const wholeCardDrag = card.type==='boardlink' || card.type==='image';
  const dragHandle = wholeCardDrag ? el : head;

  dragHandle.addEventListener('pointerdown',(e)=>{
    if(e.target.closest('.resize-handle')) return;
    if(e.button!==0) return;
    if(state.connectMode){
      handleConnectClick(card.id);
      e.stopPropagation();
      return;
    }
    e.stopPropagation();
    if(!state.selection.has(card.id)) toggleSelect(card.id, e.shiftKey);
    else if(e.shiftKey) toggleSelect(card.id,true);
    const movers=[...state.selection].map(id=>state.cards.find(c=>c.id===id)).filter(Boolean);
    const startPositions=movers.map(c=>({card:c, x:c.x, y:c.y}));
    dragState={sx:e.clientX, sy:e.clientY, moved:false, movers:startPositions};
    el.classList.add('dragging');
    dragHandle.setPointerCapture(e.pointerId);
  });
  dragHandle.addEventListener('pointermove',(e)=>{
    if(!dragState) return;
    const dx=(e.clientX-dragState.sx)/state.view.zoom;
    const dy=(e.clientY-dragState.sy)/state.view.zoom;
    if(Math.abs(dx)>2||Math.abs(dy)>2) dragState.moved=true;
    dragState.movers.forEach(m=>{
      m.card.x=snap(m.x+dx); m.card.y=snap(m.y+dy);
      const domEl=cardsLayer.querySelector(`.card[data-id="${m.card.id}"]`);
      if(domEl){ domEl.style.left=m.card.x+'px'; domEl.style.top=m.card.y+'px'; }
    });
    renderConnectors();
  });
  dragHandle.addEventListener('pointerup',(e)=>{
    if(!dragState) return;
    el.classList.remove('dragging');
    if(dragState.moved){
      DB.putCards(dragState.movers.map(m=>m.card));
    }else{
      if(card.type==='boardlink' && !e.shiftKey){ /* single click already selected; dblclick opens */ }
    }
    dragState=null;
  });
  el.addEventListener('click',(e)=>{
    if(state.connectMode) return;
  });
  // fallback: clicking a non-interactive part of the card body (e.g. an embedded video, empty
  // column space) still selects it, even though dragging stays header-only for those types.
  // Not needed for image/boardlink — their own dragHandle (the whole card) already selects.
  if(!wholeCardDrag){
    el.addEventListener('pointerdown',(e)=>{
      if(state.connectMode){ handleConnectClick(card.id); e.stopPropagation(); return; }
      if(!state.selection.has(card.id)) toggleSelect(card.id, e.shiftKey);
    });
  }
}

function attachResize(handle,el,card){
  let rs=null;
  handle.addEventListener('pointerdown',(e)=>{
    e.stopPropagation(); e.preventDefault();
    rs={sx:e.clientX, sy:e.clientY, w:card.w, h:card.h};
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove',(e)=>{
    if(!rs) return;
    const dx=(e.clientX-rs.sx)/state.view.zoom;
    const dy=(e.clientY-rs.sy)/state.view.zoom;
    card.w=snap(clamp(rs.w+dx,140,2000));
    card.h=snap(clamp(rs.h+dy,80,2000));
    el.style.width=card.w+'px'; el.style.height=card.h+'px';
    renderConnectors();
  });
  handle.addEventListener('pointerup',(e)=>{
    if(!rs) return;
    rs=null; DB.putCard(card);
  });
}

   CONNECTORS
   ============================================================ */
const connectBtn=document.getElementById('connectBtn');
connectBtn.addEventListener('click',()=>{
  state.connectMode=!state.connectMode;
  connectBtn.classList.toggle('active',state.connectMode);
  viewport.classList.toggle('connect-mode',state.connectMode);
  state.connectFrom=null;
});
function cancelConnect(){
  if(state.connectMode){ state.connectMode=false; connectBtn.classList.remove('active'); viewport.classList.remove('connect-mode'); }
  state.connectFrom=null;
}
async function handleConnectClick(cardId){
  if(!state.connectFrom){ state.connectFrom=cardId; return; }
  if(state.connectFrom===cardId){ state.connectFrom=null; return; }
  const conn={id:uid(), boardId:state.currentBoardId, fromId:state.connectFrom, toId:cardId};
  await DB.putConnector(conn);
  state.connectors.push(conn);
  state.connectFrom=null;
  renderConnectors();
}
function cardCenter(c){ return {x:c.x+c.w/2, y:c.y+c.h/2}; }
function edgePoint(c, towardX, towardY){
  const cx=c.x+c.w/2, cy=c.y+c.h/2;
  const dx=towardX-cx, dy=towardY-cy;
  if(dx===0&&dy===0) return {x:cx,y:cy};
  const hw=c.w/2, hh=c.h/2;
  const scale=Math.min(Math.abs(hw/(dx||1e-6)), Math.abs(hh/(dy||1e-6)));
  return {x:cx+dx*scale, y:cy+dy*scale};
}
function renderConnectors(){
  connectorLines.innerHTML='';
  let maxX=800,maxY=600;
  state.cards.forEach(c=>{maxX=Math.max(maxX,c.x+c.w+400); maxY=Math.max(maxY,c.y+c.h+400);});
  connectorSvg.setAttribute('width',maxX); connectorSvg.setAttribute('height',maxY);
  state.connectors.forEach(cn=>{
    const a=state.cards.find(c=>c.id===cn.fromId), b=state.cards.find(c=>c.id===cn.toId);
    if(!a||!b) return;
    const ca=cardCenter(a), cb=cardCenter(b);
    const p1=edgePoint(a,cb.x,cb.y), p2=edgePoint(b,ca.x,ca.y);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    const hit=document.createElementNS('http://www.w3.org/2000/svg','line');
    hit.setAttribute('class','hitline');
    hit.setAttribute('x1',p1.x); hit.setAttribute('y1',p1.y); hit.setAttribute('x2',p2.x); hit.setAttribute('y2',p2.y);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y); line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
    hit.addEventListener('pointerdown',(e)=>{
      e.stopPropagation();
      confirmModal('Verbindung entfernen?','Diese Verbindungslinie wird gelöscht.','Entfernen',async ()=>{
        await DB.deleteConnector(cn.id);
        state.connectors=state.connectors.filter(x=>x.id!==cn.id);
        renderConnectors();
      });
    });
    g.appendChild(line); g.appendChild(hit);
    connectorLines.appendChild(g);
  });
}

/* ============================================================
   ADD ELEMENTS (dock)
   ============================================================ */
function viewportCenterCanvas(){
  const r=viewport.getBoundingClientRect();
  return screenToCanvas(r.left+r.width/2, r.top+r.height/2);
}
let spawnCascade=0;
function cascadeCenter(){
  const base=viewportCenterCanvas();
  const step=(spawnCascade%6)*46;
  spawnCascade++;
  return {x:base.x+step, y:base.y+step};
}
async function addCard(type, extra){
  const center = extra && extra.at ? extra.at : cascadeCenter();
  let w=260,h=160,data={};
  if(type==='note'){ w=220; h=140; data={text:''}; }
  if(type==='column'){ w=380; h=280; data={title:''}; }
  if(type==='checklist'){ w=260; h=180; data={title:'',items:[]}; }
  if(type==='image'){ w=280; h=200; data={imageId:extra&&extra.imageId?extra.imageId:null, caption:''}; }
  if(type==='youtube'){ w=320; h=200; data={videoId:extra&&extra.videoId?extra.videoId:null, url:extra&&extra.url?extra.url:''}; }
  if(type==='boardlink'){
    w=200; h=140;
    const nb={id:uid(), name:extra&&extra.name?extra.name:'Unbenanntes Board', color:pickAccentColor(),
      parentBoardId:state.currentBoardId, parentCardId:null, createdAt:Date.now(), updatedAt:Date.now(),
      view:{x:0,y:0,zoom:1}, gridEnabled:true, snapEnabled:true};
    await DB.putBoard(nb);
    state.boards.push(nb);
    data={boardId:nb.id, title:nb.name};
  }
  const card={
    id:uid(), boardId:state.currentBoardId, type, color:'none',
    x:snap(center.x-w/2), y:snap(center.y-h/2), w, h, z:nextZ(), data,
    createdAt:Date.now(), updatedAt:Date.now()
  };
  if(type==='column') card.z = Math.min(0,...state.cards.map(c=>c.z||0)) - 1;
  // render + focus immediately (optimistic UI) so the toolbar button is never left
  // focused while the user starts typing; persist to IndexedDB in the background.
  state.cards.push(card);
  renderAllCards();
  selectOnly(card.id);
  touchBoard();
  focusNewCard(card);
  DB.putCard(card);
  return card;
}
function focusNewCard(card){
  // Runs synchronously right after renderAllCards(), in the same call stack — the card's DOM
  // node already exists (innerHTML/appendChild are synchronous), so focusing here (rather than
  // deferring to requestAnimationFrame) guarantees the very first keystroke lands in the field,
  // not on whatever the browser focuses by default (or drops) for one extra frame.
  const el=cardsLayer.querySelector(`.card[data-id="${card.id}"]`);
  if(!el) return;
  let target=null;
  if(card.type==='note') target=el.querySelector('.note-body');
  else if(card.type==='column') target=el.querySelector('.column-title');
  else if(card.type==='checklist') target=el.querySelector('.checklist-title');
  else if(card.type==='boardlink') target=el.querySelector('.bl-name');
  if(!target) return;
  target.focus();
  if(target.isContentEditable){
    const range=document.createRange(); range.selectNodeContents(target); range.collapse(false);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  }else if(typeof target.select==='function'){ target.select(); }
}
function touchBoard(){
  const b=boardById(state.currentBoardId); if(!b) return;
  b.updatedAt=Date.now(); DB.putBoard(b);
}

document.getElementById('dock').addEventListener('click',(e)=>{
  const btn=e.target.closest('.dock-btn[data-add]');
  if(!btn) return;
  btn.blur(); // never leave the toolbar button focused — typing right after must land in the new card, not re-trigger this button
  const type=btn.dataset.add;
  if(type==='image'){ triggerImagePicker(); return; }
  if(type==='board'){ addCard('boardlink'); return; }
  addCard(type);
});

/* ---- image import: file picker, paste, drag&drop ---- */
const fileInput=document.createElement('input');
fileInput.type='file'; fileInput.accept='image/*'; fileInput.multiple=true; fileInput.style.display='none';
document.body.appendChild(fileInput);
function triggerImagePicker(){ fileInput.value=''; fileInput.click(); }
fileInput.addEventListener('change',async ()=>{
  const files=[...fileInput.files];
  let offset=0;
  for(const f of files){ await addImageFile(f, offsetPoint(offset)); offset++; }
});
function offsetPoint(i){
  const c=viewportCenterCanvas();
  return {x:c.x+i*26, y:c.y+i*26};
}
async function addImageFile(file, at){
  if(!file.type.startsWith('image/')) return;
  const dims=await imageDims(file).catch(()=>({w:280,h:200}));
  const maxW=340;
  let w=dims.w,h=dims.h;
  if(w>maxW){ h=Math.round(h*(maxW/w)); w=maxW; }
  h=clamp(h,120,480); w=clamp(w,160,maxW);
  const id=uid();
  await DB.putImage(id,file);
  await addCard('image',{imageId:id, at:at||viewportCenterCanvas()});
  const card=state.cards[state.cards.length-1];
  card.w=w; card.h=h+34; DB.putCard(card);
  renderAllCards(); applySelectionClasses();
}
function imageDims(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{res({w:img.naturalWidth,h:img.naturalHeight}); URL.revokeObjectURL(url);};
    img.onerror=rej;
    img.src=url;
  });
}

viewport.addEventListener('dragover',(e)=>{ e.preventDefault(); });
viewport.addEventListener('drop',async (e)=>{
  e.preventDefault();
  const files=[...(e.dataTransfer.files||[])].filter(f=>f.type.startsWith('image/'));
  if(!files.length) return;
  const at=screenToCanvas(e.clientX,e.clientY);
  let i=0;
  for(const f of files){ await addImageFile(f,{x:at.x+i*26,y:at.y+i*26}); i++; }
});

window.addEventListener('paste',async (e)=>{
  if(state.screen!=='board') return;
  if(isEditingTarget(document.activeElement)) return;
  const items=[...(e.clipboardData ? e.clipboardData.items : [])];
  const imgItem=items.find(it=>it.type && it.type.startsWith('image/'));
  if(imgItem){
    const file=imgItem.getAsFile();
    if(file) await addImageFile(file, state.lastPointer);
    return;
  }
  const text=e.clipboardData ? e.clipboardData.getData('text') : '';
  const vid=extractYouTubeId(text);
  if(vid && /youtu/.test(text)){
    await addCard('youtube',{videoId:vid, url:text, at:state.lastPointer});
  }
});

/* ============================================================
   SPEICHERORDNER (File System Access API)
   ============================================================ */
const folderBtn=document.getElementById('folderBtn');
const folderLabel=document.getElementById('folderLabel');
const importBtn=document.getElementById('importBtn');

function updateFolderStatusUI(){
  if(!folderBtn) return;
  folderBtn.classList.remove('connected','pending');
  if(!FS_SUPPORTED){
    folderLabel.textContent='Ordner nicht verfügbar';
    folderBtn.title='Dieser Browser unterstützt keine Ordner-Anbindung.';
  }else if(state.storageMode==='fs' && fsState.root){
    folderBtn.classList.add('connected');
    folderLabel.textContent=fsState.rootName;
    folderBtn.title='Verbunden mit „'+fsState.rootName+'“ – klicken für Optionen';
  }else if(fsState.pendingHandle){
    folderBtn.classList.add('pending');
    folderLabel.textContent='Ordner-Zugriff bestätigen';
    folderBtn.title='Zugriff auf den zuletzt verbundenen Ordner erneut bestätigen';
  }else{
    folderLabel.textContent='Ordner wählen';
    folderBtn.title='Speicherordner für deine Boards wählen';
  }
}

async function activateFolder(handle,opts){
  opts=opts||{};
  fsState.root=handle; fsState.rootName=handle.name;
  fsState.dirs.clear(); fsState.cache.clear();
  fsState.cardOwner.clear(); fsState.connOwner.clear(); fsState.imageOwner.clear(); fsState.imageExt.clear();
  state.storageMode='fs';
  await saveHandleRef(handle);
  if(opts.offerMigration){
    try{
      const existing=await IDB_DB.allBoards();
      const scanned=await FS_DB.allBoards();
      if(existing.length && scanned.length===0){
        confirmModal('Vorhandene Boards übernehmen?','Es gibt Boards, die bisher nur lokal im Browser gespeichert waren. Sollen sie in den gewählten Ordner kopiert werden?','Übernehmen',async ()=>{
          await migrateIdbToFs(existing);
          updateFolderStatusUI();
          refreshHome();
        });
      }
    }catch(e){}
  }
  updateFolderStatusUI();
}

async function connectFolder(){
  if(!FS_SUPPORTED){ showToast('Dieser Browser unterstützt keine Ordner-Anbindung.'); return; }
  let handle;
  try{ handle=await window.showDirectoryPicker({id:'notua-boards', mode:'readwrite', startIn:'documents'}); }
  catch(e){ return; }
  await activateFolder(handle,{offerMigration:true});
  refreshHome();
}
async function tryReconnectFolder(){
  if(!FS_SUPPORTED) return;
  let handle=null;
  try{ handle=await loadHandleRef(); }catch(e){}
  if(!handle) return;
  try{
    const perm=await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){ await activateFolder(handle,{offerMigration:false}); }
    else{ fsState.pendingHandle=handle; updateFolderStatusUI(); }
  }catch(e){}
}
async function confirmPendingFolder(){
  if(!fsState.pendingHandle) return;
  try{
    const perm=await fsState.pendingHandle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){
      const h=fsState.pendingHandle; fsState.pendingHandle=null;
      await activateFolder(h,{offerMigration:false});
      refreshHome();
    }
  }catch(e){}
}
async function disconnectFolder(){
  state.storageMode='idb';
  fsState.root=null; fsState.rootName='';
  fsState.dirs.clear(); fsState.cache.clear();
  fsState.cardOwner.clear(); fsState.connOwner.clear(); fsState.imageOwner.clear(); fsState.imageExt.clear();
  await clearHandleRef();
  updateFolderStatusUI();
  showToast('Ordner getrennt – deine Boards bleiben dort gespeichert.');
  refreshHome();
}
function folderStatusModal(){
  const scrim=document.createElement('div'); scrim.className='modal-scrim';
  scrim.innerHTML=`<div class="modal">
    <h4>Speicherordner</h4>
    <p>Verbunden mit „${escapeHtml(fsState.rootName)}“. Jedes Board liegt dort in einem eigenen Unterordner – du kannst den ganzen Ordner verschieben, kopieren oder z. B. per Cloud-Sync auf ein anderes Gerät übertragen und dort erneut verbinden.</p>
    <div class="modal-actions" style="justify-content:space-between;">
      <button data-a="disconnect">Trennen</button>
      <button data-a="change" class="primary" style="background:var(--accent);border-color:var(--accent);">Ordner wechseln</button>
    </div></div>`;
  scrim.addEventListener('click',(e)=>{ if(e.target===scrim) scrim.remove(); });
  scrim.querySelector('[data-a="disconnect"]').addEventListener('click',async ()=>{ scrim.remove(); await disconnectFolder(); });
  scrim.querySelector('[data-a="change"]').addEventListener('click',async ()=>{ scrim.remove(); await connectFolder(); });
  document.body.appendChild(scrim);
}
async function migrateIdbToFs(idbBoards){
  for(const b of idbBoards){ await FS_DB.putBoard(b); }
  for(const b of idbBoards){
    const cards=await IDB_DB.cardsForBoard(b.id);
    for(const c of cards){
      if(c.type==='image' && c.data && c.data.imageId){
        const img=await IDB_DB.getImage(c.data.imageId);
        if(img) await FS_DB.putImage(c.data.imageId, img.blob, b.id);
      }
      await FS_DB.putCard(c);
    }
    const conns=await IDB_DB.connectorsForBoard(b.id);
    for(const cn of conns) await FS_DB.putConnector(cn);
  }
}

folderBtn.addEventListener('click',async ()=>{
  if(state.storageMode==='fs' && fsState.root){ folderStatusModal(); }
  else if(fsState.pendingHandle){ await confirmPendingFolder(); }
  else{ await connectFolder(); }
});

/* ============================================================
   BOARD IMPORT / EXPORT
   ============================================================ */
function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]||'');
    r.onerror=rej;
    r.readAsDataURL(blob);
  });
}
async function base64ToBlob(b64,mime){
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime||'application/octet-stream'});
}
async function downloadOrSaveFile(filename,content,mime){
  // A plain <a download> is used unconditionally: it never needs a permission dialog and can't hang.
  // showSaveFilePicker looks tempting (lets the user pick a folder) but in practice its failure modes
  // are unreliable to tell apart — "user clicked cancel" and "couldn't even open, no user gesture"
  // can surface as the very same error, so trusting it risks silently dropping the export with no
  // file saved and no message shown. The plain download always lands in the browser's downloads
  // folder under the suggested name, which is the same mechanism used to deliver Notua.html itself.
  try{
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return true;
  }catch(e){ showToast('Export ist in dieser Ansicht nicht möglich.'); return false; }
}
async function exportBoard(boardId){
  const bundle=await collectBoardBundle(boardId);
  if(!bundle.boards.length){ showToast('Board konnte nicht exportiert werden.'); return; }
  const rootBoard=bundle.boards.find(b=>b.id===boardId)||bundle.boards[0];
  const images=[];
  for(const img of bundle.images){
    images.push({id:img.id, mime:(img.blob&&img.blob.type)||'image/png', dataBase64: await blobToBase64(img.blob)});
  }
  const payload={notuaExport:1, exportedAt:Date.now(), rootBoardId:boardId,
    boards:bundle.boards, cards:bundle.cards, connectors:bundle.connectors, images};
  const filename=slugify(rootBoard?rootBoard.name:'Board')+'.notua.json';
  const ok=await downloadOrSaveFile(filename, JSON.stringify(payload), 'application/json');
  if(ok) showToast('Board exportiert: '+filename);
}
const importInput=document.createElement('input');
importInput.type='file'; importInput.accept='.json,application/json'; importInput.style.display='none';
document.body.appendChild(importInput);
function triggerImport(){ importInput.value=''; importInput.click(); }
importInput.addEventListener('change',async ()=>{
  const file=importInput.files[0]; if(!file) return;
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    if(!payload || payload.notuaExport!==1 || !Array.isArray(payload.boards)) throw new Error('format');
    await importBundle(payload);
  }catch(e){ showToast('Diese Datei konnte nicht importiert werden.'); }
});
importBtn.addEventListener('click',triggerImport);

async function importBundle(payload){
  const idMap=new Map();
  function remap(id){ if(!id) return id; if(!idMap.has(id)) idMap.set(id,uid()); return idMap.get(id); }

  const newBoards=payload.boards.map(b=>({
    ...b, id:remap(b.id),
    parentBoardId: (b.parentBoardId && payload.boards.some(x=>x.id===b.parentBoardId)) ? remap(b.parentBoardId) : null,
    parentCardId:null,
  }));
  const rootNewId=idMap.get(payload.rootBoardId);
  const rootBoard=newBoards.find(b=>b.id===rootNewId);
  if(rootBoard) rootBoard.parentBoardId=null;

  const newImages=(payload.images||[]).map(img=>({id:remap(img.id), mime:img.mime, dataBase64:img.dataBase64}));
  const newCards=(payload.cards||[]).map(c=>{
    const nc={...c, id:remap(c.id), boardId:remap(c.boardId), data:JSON.parse(JSON.stringify(c.data||{}))};
    if(nc.type==='boardlink' && nc.data.boardId) nc.data.boardId=remap(nc.data.boardId);
    if(nc.type==='image' && nc.data.imageId) nc.data.imageId=remap(nc.data.imageId);
    return nc;
  });
  const newConnectors=(payload.connectors||[]).map(cn=>({...cn, id:remap(cn.id), boardId:remap(cn.boardId), fromId:remap(cn.fromId), toId:remap(cn.toId)}));

  const now=Date.now();
  for(const b of newBoards){ b.createdAt=now; b.updatedAt=now; await DB.putBoard(b); }
  for(const img of newImages){
    const blob=await base64ToBlob(img.dataBase64,img.mime);
    const ownerCard=newCards.find(c=>c.type==='image' && c.data.imageId===img.id);
    await DB.putImage(img.id, blob, ownerCard?ownerCard.boardId:rootNewId);
  }
  for(const c of newCards) await DB.putCard(c);
  for(const cn of newConnectors) await DB.putConnector(cn);

  showToast('Board importiert');
  if(state.screen==='home') await refreshHome();
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  document.addEventListener('contextmenu',(e)=>{ if(e.target.closest('#app')) e.preventDefault(); });
  await tryReconnectFolder();
  await refreshHome();
  window.addEventListener('resize',()=>{ if(state.screen==='board') applyView(); });
})();

})();
</script>
